[project]
name = "ai-chat-application"
version = "1.0.0"
description = "Production-grade AI Chat Application with LLM API orchestration, context management, parameter optimization, structured JSON responses, and cost tracking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0"
]

[tool.vercel]
entrypoint = "backend.app:app"
